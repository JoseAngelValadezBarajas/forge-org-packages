name: Publish packages

on:
  workflow_dispatch:
  push:
    tags: ['packages-v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run quality
      - run: npm run publish:packages
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/packages-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Forge packages ${GITHUB_REF_NAME#packages-v}" --generate-notes
